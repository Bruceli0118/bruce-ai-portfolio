<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>页面未找到 · Bruce AI Portfolio</title>
  <style>
    :root{color-scheme:light;font-family:Arial,"PingFang SC",sans-serif;color:#10233f;background:#eaf7f7}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:620px;padding:48px;border:1px solid #c9dadb;border-radius:24px;background:#fff;box-shadow:0 24px 70px rgba(16,35,63,.08)}
    small{color:#197d80;letter-spacing:.12em}h1{font-size:clamp(32px,7vw,58px);margin:18px 0 12px}p{color:#5b6c7d;line-height:1.8}
    a{display:inline-block;margin-top:18px;padding:12px 20px;border-radius:999px;background:#197d80;color:#fff;text-decoration:none}
  </style>
</head>
<body>
  <main><small>404 / PAGE NOT FOUND</small><h1>这个页面不存在。</h1><p>链接可能已更新，返回作品集首页继续浏览。</p><a id="home" href="./">返回首页</a></main>
  <script>
    const parts = location.pathname.split('/').filter(Boolean);
    const base = location.hostname.endsWith('.github.io') && parts.length ? '/' + parts[0] + '/' : '/';
    document.getElementById('home').href = base;
  </script>
</body>
</html>
